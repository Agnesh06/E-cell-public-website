<!doctype html>
<html lang="en">
  <head>

    <title>CSEA E-Cell | PSG College of Technology</title>
    <!-- Preload critical self-hosted fonts -->

    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin="anonymous" />

    <style>
      @font-face {
        font-family: 'Plus Jakarta Sans Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 200 800;
        src: url('/fonts/plus-jakarta-sans-latin.woff2') format('woff2-variations'),
             url('/fonts/plus-jakarta-sans-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-display: swap;
        font-weight: 200 800;
        src: url('/fonts/plus-jakarta-sans-latin.woff2') format('woff2-variations'),
             url('/fonts/plus-jakarta-sans-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('/fonts/inter-latin.woff2') format('woff2-variations'),
             url('/fonts/inter-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('/fonts/inter-latin.woff2') format('woff2-variations'),
             url('/fonts/inter-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Geist Mono Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('/fonts/geist-mono-latin.woff2') format('woff2-variations'),
             url('/fonts/geist-mono-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Geist Mono';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('/fonts/geist-mono-latin.woff2') format('woff2-variations'),
             url('/fonts/geist-mono-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Plus Jakarta Sans Fallback';
        src: local('Arial');
        size-adjust: 103.36%;
        ascent-override: 103.8%;
        descent-override: 22.2%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: 'Inter Fallback';
        src: local('Arial');
        size-adjust: 107.4%;
        ascent-override: 90.2%;
        descent-override: 22.5%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: 'Geist Mono Fallback';
        src: local('Consolas'), local('Courier New'), monospace;
        size-adjust: 98%;
        ascent-override: 95%;
        descent-override: 25%;
        line-gap-override: 0%;
      }
      html, body {
        margin: 0;
        background-color: #FAFAFD;
        font-family: 'Inter Variable', 'Inter', 'Inter Fallback', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #root {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }
    </style>
    <script>
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      window.scrollTo(0, 0);
    </script>
  </head>
  <body>
    <div id="root">
      <div class="landing-page">

              <p class="hero-eyebrow block text-xs md:text-sm font-mono tracking-[0.22em] text-[#2547FF] uppercase mb-4 md:mb-6" style="color: #2547FF; font-family: 'Geist Mono Variable', 'Geist Mono', 'Geist Mono Fallback', ui-monospace, monospace; letter-spacing: 0.22em; text-transform: uppercase; margin-bottom: 1.5rem;">
                CSEA E-CELL - PSG COLLEGE OF TECHNOLOGY
              </p>

                <span class="overflow-hidden block pb-2 -mb-2">
                  <span class="hero-title-line block">Ideas are just</span>
                </span>
                <span class="overflow-hidden block pb-4 -mb-4">
                  <span class="hero-title-line block text-[#2547FF]" style="color: #2547FF;">the beginning.</span>
                </span>
              </h1>
              <p class="hero-paragraph text-base md:text-lg font-semibold text-[rgb(11_11_15_/_0.62)] max-w-[52ch] leading-relaxed mb-8 md:mb-10" style="color: rgba(11, 11, 15, 0.62); font-size: 1.125rem; line-height: 1.625; max-width: 52ch; margin-bottom: 2.5rem;">

              </p>
              <div class="hero-buttons flex flex-col min-[480px]:flex-row gap-4 items-stretch min-[480px]:items-center" style="display: flex; gap: 1rem; align-items: center;">
                <a href="/contact" style="display: inline-flex; align-items: center; justify-content: center; background-color: #2547FF; color: #ffffff; padding: 0.75rem 1.5rem; border-radius: 9999px; text-decoration: none; font-weight: 500; font-size: 0.875rem;">
                  Get Involved &rarr;
                </a>
                <button type="button" style="display: inline-flex; align-items: center; justify-content: center; background-color: #ffffff; color: #0B0B0F; border: 1px solid #E5E5E7; padding: 0.75rem 1.5rem; border-radius: 9999px; font-weight: 500; font-size: 0.875rem; cursor: pointer;">
                  Explore Our Vision
                </button>
              </div>
            </div>
          </div>
          <div class="container-site relative z-10 w-full pt-4 flex flex-wrap items-end justify-between gap-4 text-[10px] sm:text-xs font-mono tracking-[0.2em] text-[rgb(11_11_15_/_0.42)] select-none pointer-events-none" style="max-width: 1280px; margin: auto; padding: 1rem 1.5rem; display: flex; justify-content: space-between; font-family: 'Geist Mono Variable', 'Geist Mono', 'Geist Mono Fallback', ui-monospace, monospace; font-size: 0.75rem; color: rgba(11, 11, 15, 0.42);">
            <div style="display: flex; align-items: center; gap: 0.75rem;">
              <span>SCROLL</span>
              <span class="scroll-indicator-line" style="display: inline-block; width: 1px; height: 1.5rem; background-color: rgba(11, 11, 15, 0.42);" aria-hidden="true"></span>
            </div>
            <div>
              <span>IDEATE · COLLABORATE · BUILD</span>
            </div>
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
