<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAFAFD" />
    <title>CSEA E-Cell | PSG College of Technology</title>
    <script>
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      window.scrollTo(0, 0);
    </script>
  </head>
  <body>
    <div id="root">
      <div class="landing-page">
        <section class="landing-hero relative min-h-[100svh] w-full flex flex-col justify-between overflow-hidden bg-[#FAFAFD] pt-28 pb-4 md:pt-36 md:pb-6" style="background-color: #FAFAFD;">
          <div class="container-site relative z-10 my-auto flex flex-col justify-center w-full" style="max-width: 1280px; margin: auto; padding: 0 1.5rem;">
            <div class="w-full" style="max-width: 62%;">
              <p class="hero-eyebrow block text-xs md:text-sm font-mono tracking-[0.22em] text-[#2547FF] uppercase mb-4 md:mb-6" style="color: #2547FF; font-family: monospace; letter-spacing: 0.22em; text-transform: uppercase; margin-bottom: 1.5rem;">
                CSEA E-CELL - PSG COLLEGE OF TECHNOLOGY
              </p>
              <h1 id="landing-hero-title" class="font-medium tracking-[-0.03em] leading-[0.95] text-[clamp(3rem,7vw,6.5rem)] text-[#0B0B0F] mb-6 md:mb-8" style="font-size: clamp(3rem, 7vw, 6.5rem); line-height: 0.95; letter-spacing: -0.03em; color: #0B0B0F; margin-bottom: 2rem;">
                <span class="overflow-hidden block pb-2 -mb-2">
                  <span class="hero-title-line block">Ideas are just</span>
                </span>
                <span class="overflow-hidden block pb-4 -mb-4">
                  <span class="hero-title-line block text-[#2547FF]" style="color: #2547FF;">the beginning.</span>
                </span>
              </h1>
              <p class="hero-paragraph text-base md:text-lg font-semibold text-[rgb(11_11_15_/_0.62)] max-w-[52ch] leading-relaxed mb-8 md:mb-10" style="color: rgba(11, 11, 15, 0.62); font-size: 1.125rem; line-height: 1.625; max-width: 52ch; margin-bottom: 2.5rem;">
                A space to ideate, collaborate, and build. Turn your curiosity into ideas, your ideas into solutions, and your solutions into something that matters.
              </p>
              <div class="hero-buttons flex flex-col min-[480px]:flex-row gap-4 items-stretch min-[480px]:items-center" style="display: flex; gap: 1rem; align-items: center;">
                <a href="/contact" style="display: inline-flex; align-items: center; justify-content: center; background-color: #2547FF; color: #ffffff; padding: 0.75rem 1.5rem; border-radius: 9999px; text-decoration: none; font-weight: 500; font-size: 0.875rem;">
                  Get Involved &rarr;
                </a>
                <button type="button" style="display: inline-flex; align-items: center; justify-content: center; background-color: #ffffff; color: #0B0B0F; border: 1px solid #E5E5E7; padding: 0.75rem 1.5rem; border-radius: 9999px; font-weight: 500; font-size: 0.875rem; cursor: pointer;">
                  Explore Our Vision
                </button>
              </div>
            </div>
          </div>
          <div class="container-site relative z-10 w-full pt-4 flex flex-wrap items-end justify-between gap-4 text-[10px] sm:text-xs font-mono tracking-[0.2em] text-[rgb(11_11_15_/_0.42)] select-none pointer-events-none" style="max-width: 1280px; margin: auto; padding: 1rem 1.5rem; display: flex; justify-content: space-between; font-family: monospace; font-size: 0.75rem; color: rgba(11, 11, 15, 0.42);">
            <div style="display: flex; align-items: center; gap: 0.75rem;">
              <span>SCROLL</span>
              <span class="scroll-indicator-line" style="display: inline-block; width: 1px; height: 1.5rem; background-color: rgba(11, 11, 15, 0.42);" aria-hidden="true"></span>
            </div>
            <div>
              <span>IDEATE · COLLABORATE · BUILD</span>
            </div>
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
